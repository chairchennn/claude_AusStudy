<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>學習練習 App</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">學習練習</h1>
    <button id="settingsBtn" class="btn btn--icon" title="設定 API Key" aria-label="設定">⚙️</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab tab--active" data-tab="learning" role="tab" aria-selected="true">學習練習</button>
    <button class="tab" data-tab="todo" role="tab" aria-selected="false" disabled>課堂整理（即將推出）</button>
  </nav>

  <main>
    <section id="panel-learning" class="panel panel--active" role="tabpanel">

      <!-- Step 1: 輸入素材 -->
      <div id="step-input" class="card">
        <h2 class="card__title">1. 貼上學習素材</h2>
        <textarea id="materialInput" class="textarea" rows="8"
          placeholder="貼上文章、影片重點、投影片內容…"></textarea>
        <div class="card__actions">
          <button id="startBtn" class="btn btn--primary">開始練習</button>
        </div>
      </div>

      <!-- 素材摘要：老師為什麼要你讀這個 / 你應該學到什麼（只在第一題出現一次，之後每題都留著） -->
      <div id="summarySection" class="card hidden">
        <h2 class="card__title">素材摘要</h2>
        <p id="materialSummaryEn" class="translation-box"></p>
      </div>

      <!-- Step 2: 提問 -->
      <div id="step-question" class="card hidden">
        <h2 class="card__title">2. AI 提問</h2>
        <div id="questionLoading" class="loading hidden">思考題目中…</div>
        <div id="questionBox" class="question-box hidden">
          <p class="question-en" id="questionEn"></p>
          <p class="question-zh" id="questionZhHint"></p>
        </div>

        <label class="label" for="answerInput">你的英文回答</label>
        <textarea id="answerInput" class="textarea" rows="5" placeholder="用英文回答這題…"></textarea>
        <div class="card__actions">
          <button id="submitAnswerBtn" class="btn btn--primary">送出回答</button>
          <button id="newMaterialBtn" class="btn btn--ghost">換一段素材</button>
        </div>
      </div>

      <!-- Step 3: 回饋 -->
      <div id="step-review" class="card hidden">
        <h2 class="card__title">3. 潤飾與回饋</h2>
        <div id="reviewLoading" class="loading hidden">批改中…</div>

        <div id="reviewBox" class="hidden">
          <div class="badge-row">
            <span id="understandingBadge" class="badge"></span>
          </div>

          <div class="table-wrap">
            <table class="correction-table">
              <thead>
                <tr><th>原句</th><th>修正句</th><th>修改原因</th></tr>
              </thead>
              <tbody id="correctionTableBody"></tbody>
            </table>
          </div>

          <h3 class="subheading">中文翻譯</h3>
          <p id="zhTranslation" class="translation-box"></p>
        </div>

        <div class="card__actions">
          <button id="nextQuestionBtn" class="btn btn--primary">下一題（同素材）</button>
          <button id="restartBtn" class="btn btn--ghost">換一段素材</button>
        </div>
      </div>

      <!-- 本次紀錄（僅本頁面 session，尚未存檔） -->
      <div id="historySection" class="card hidden">
        <h2 class="card__title">本次紀錄</h2>
        <ol id="historyList" class="history-list"></ol>
      </div>

    </section>

    <section id="panel-todo" class="panel" role="tabpanel" hidden>
      <div class="card">
        <p>課堂資訊整理模組即將推出。</p>
      </div>
    </section>
  </main>

  <!-- 設定 Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal__content">
      <h2>設定</h2>
      <label class="label" for="apiKeyInput">Claude API Key</label>
      <input id="apiKeyInput" class="input" type="password" placeholder="sk-ant-..." autocomplete="off" />

      <label class="label" for="modelSelect">模型</label>
      <select id="modelSelect" class="input">
        <option value="claude-opus-5">Claude Opus 5（最聰明，較貴）</option>
        <option value="claude-sonnet-5">Claude Sonnet 5（平衡）</option>
        <option value="claude-haiku-4-5">Claude Haiku 4.5（最快最便宜）</option>
      </select>

      <p class="hint">
        API Key 只會存在你這台瀏覽器的 localStorage，不會上傳到任何伺服器。
        但因為是純前端直連 API，Key 仍可能在瀏覽器開發者工具中被看到——請勿在公用電腦使用，也不要把這個網頁部署成公開網站給別人用。
      </p>

      <div class="card__actions">
        <button id="saveSettingsBtn" class="btn btn--primary">儲存</button>
        <button id="closeSettingsBtn" class="btn btn--ghost">關閉</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
